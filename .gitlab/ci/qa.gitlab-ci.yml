# End-to-end QA suite (reticulum/qa). Three entry points:
#
#   qa:docker-compose  boot the product docker-compose stack, seed it, run the suite
#                      in-network (selenium + runner resolve http://nginx).
#   qa:terraform       stand up the terraform/docker stack, seed it, run the suite.
#   qa:external        run the suite against an already-running deployment (staging)
#                      given QA_BASE_URL — no build, no seed. The "isolated" mode.
#
# All jobs are opt-in (gated on $RUN_QA, except qa:external which triggers on
# $QA_BASE_URL) so adding them never disturbs the existing build pipeline. Flip
# RUN_QA="true" (or set QA_BASE_URL) as a pipeline/schedule variable to run them.

# --- Shared defaults ---------------------------------------------------------
.qa:
  stage: test
  extends:
    - .dind
    - .default-retry
  image: ghcr.io/code0-tech/build-images/reticulum-builder:227.1-ruby-3.4.7-amd64
  variables:
    # QA user the suite logs in as (seeded for local deployments).
    QA_USER_EMAIL: "qa-admin@example.com"
    QA_USER_PASSWORD: "qa-password-123"
    QA_USER_USERNAME: "qa-admin"
    QA_RUNTIME_TOKEN: "runtime_token"
    QA_HEADLESS: "true"
    QA_WEBDRIVER_INSECURE: "true"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - qa/tmp/screenshots
    reports:
      junit: qa/tmp/rspec.xml

# Seeding note: the sagittarius image seeds the root user + a runtime on first boot
# from the INITIAL_ROOT_MAIL / INITIAL_ROOT_PASSWORD / INITIAL_RUNTIME_TOKEN env
# (db/fixtures/production). The suite's default credentials match those, so no
# explicit seed step is needed for docker-compose.

# --- docker-compose deployment ----------------------------------------------
qa:docker-compose:
  extends: .qa
  tags:
    - c0-amd64
  # Needs every image the stack boots (built + manifested earlier in the pipeline).
  # nats/postgres/nginx base images are public and need no build job.
  needs:
    - generate-environment
    - manifest:config-generator
    - job: manifest:sagittarius
      parallel:
        matrix:
          - VARIANT: ce
    - manifest:sagittarius:gateway
    - job: manifest:sculptor
      parallel:
        matrix:
          - VARIANT: ce
    - manifest:aquila
    - manifest:taurus
    - manifest:postgresql
  rules:
    - if: '$RUN_QA == "true"'
  variables:
    # Point the product compose at the CI-built images.
    IMAGE_REGISTRY: "ghcr.io/code0-tech/reticulum/ci-builds"
    IMAGE_TAG: "$RETICULUM_CONTAINER_VERSION"
    IMAGE_EDITION: "ce"
    # The REST/cron actions are built in centaurus, not here. Provide a published
    # action tag as a pipeline variable (defaults to "main" if unset).
    ACTION_IMAGE_TAG: "${ACTION_IMAGE_TAG:-main}"
    # Run the platform + runtime, but NOT velorum (needs model API keys).
    COMPOSE_PROFILES: "ide,runtime"
    COMPOSE: >-
      docker compose
      -f docker-compose/docker-compose.yml --env-file docker-compose/.env
      -f qa/docker-compose.qa.yml
    QA_BASE_URL: "http://nginx"
    QA_SELENIUM_URL: "http://selenium:4444/wd/hub"
    QA_DEPLOYMENT: "docker-compose"
    QA_SEED: "false" # the stack self-seeds on boot (see note above)
  before_script:
    - source support/helpers.sh && docker_login
    - export HTTP_PORT=80 HTTPS_PORT=443 HOSTNAME=localhost
    # nginx has a `listen 443 ssl` block; generate throwaway certs so `nginx -t` passes.
    - qa/support/gen_certs docker-compose/certs localhost
    - $COMPOSE up -d
    - docker ps --all
    # Wait for the backend to answer through nginx (fixtures load during boot).
    - qa/support/wait_for_http http://docker/health/liveness 120 3
  script:
    # Build + run the suite in-network. Keep the container so we can lift artifacts.
    - $COMPOSE run --build --name qa-runner qa || QA_EXIT=$?
    - mkdir -p qa/tmp
    - docker cp qa-runner:/qa/tmp/. qa/tmp/ || true
    - docker rm qa-runner || true
    - exit ${QA_EXIT:-0}
  after_script:
    - $COMPOSE logs --no-color > qa/tmp/stack.log 2>&1 || true
    - $COMPOSE down -v || true

# --- terraform/docker deployment ---------------------------------------------
# Stands up the same stack through terraform. The suite runs directly from the job
# against the nginx port terraform published; a job-level selenium service drives
# the browser. Requires the terraform stack to publish http_port and be reachable
# from the selenium service (validate on a real runner).
qa:terraform:
  extends: .qa
  tags:
    - c0-amd64
  needs:
    - generate-environment
  rules:
    - if: '$RUN_QA == "true"'
  image: ghcr.io/code0-tech/build-images/reticulum-builder:227.1-ruby-3.4.7-amd64
  services:
    - name: docker:29.8.1-dind
      alias: docker
      entrypoint: ["sh", "-c", "dockerd-entrypoint.sh $DOCKER_OPTIONS"]
    - name: selenium/standalone-chrome:131.0
      alias: selenium
  variables:
    QA_DEPLOYMENT: "terraform"
    QA_SELENIUM_URL: "http://selenium:4444/wd/hub"
    QA_SEED: "false"
    COMPOSE: "docker compose -f docker-compose/docker-compose.yml --env-file docker-compose/.env"
  before_script:
    - terraform -chdir=terraform/docker init -input=false
    - terraform -chdir=terraform/docker apply -auto-approve -input=false
    - export QA_BASE_URL="http://$(terraform -chdir=terraform/docker output -raw nginx_container_hostname)"
    # The stack self-seeds the root user + runtime on boot (INITIAL_* env), same as
    # docker-compose, so no explicit seed step is needed here either.
    - qa/support/wait_for_http "$QA_BASE_URL/health/liveness" 120 3
  script:
    - cd qa && bundle install
    - >
      bundle exec rspec qa/specs
      --format documentation
      --format RspecJunitFormatter --out tmp/rspec.xml
  after_script:
    - terraform -chdir=terraform/docker destroy -auto-approve -input=false || true

# --- external / staging (isolated) -------------------------------------------
# No build, no deployment, no seed: run the suite against an existing, publicly
# reachable deployment. Triggers whenever QA_BASE_URL is provided; also offered
# as a manual job. The selenium service navigates QA_BASE_URL directly, so the URL
# must be reachable from CI.
qa:external:
  extends: .qa
  needs: []
  rules:
    - if: '$QA_BASE_URL'
    - when: manual
      allow_failure: true
  services:
    - name: selenium/standalone-chrome:131.0
      alias: selenium
  variables:
    QA_DEPLOYMENT: "external"
    QA_SEED: "false"
    QA_SELENIUM_URL: "http://selenium:4444/wd/hub"
  before_script:
    - test -n "$QA_BASE_URL" || { echo "QA_BASE_URL must be set for qa:external"; exit 1; }
  script:
    - cd qa && bundle install
    - >
      bundle exec rspec qa/specs
      --format documentation
      --format RspecJunitFormatter --out tmp/rspec.xml
