.qa:docker-based:
  stage: test
  extends:
    - .dind
    - .default-retry
  tags:
    - c0-amd64
  image: ghcr.io/code0-tech/build-images/reticulum-builder:680.1-ruby-3.4.13
  dependencies:
    - generate-environment
  services:
    - !reference [.dind, services]
    - name: selenium/standalone-firefox:160.0-20261120
      alias: selenium
  variables:
    QA_BASE_URL: "http://docker"
    QA_CAPYBARA_DRIVER: "firefox_bidi_remote"
    QA_SELENIUM_REMOTE_URL: "http://selenium:4444"
    FF_NETWORK_PER_BUILD: "true"
    IMAGE_REGISTRY: "ghcr.io/code0-tech/reticulum/ci-builds"
    IMAGE_TAG: "$RETICULUM_CONTAINER_VERSION"
    IMAGE_EDITION: "ce"
    ACTION_IMAGE_TAG: "0.0.0-experimental-3028768426-71ac23091efd1ca7268de29f7507f99bea193420"
  script:
    - support/wait_for_http "$QA_BASE_URL/health/liveness" 60 3
    - support/wait_for_http "$QA_SELENIUM_REMOTE_URL/status" 30 2
    - cd qa
    - bundle install
    - bundle exec rspec --format doc --format RspecJunitFormatter --out tmp/rspec.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - qa/tmp/screenshots
      - qa/tmp/stack.log
    reports:
      junit:
        - qa/tmp/rspec.xml

qa:docker-compose:
  extends:
    - .qa:docker-based
  variables:
    COMPOSE_PROFILES: "ide,runtime"
    HTTP_PORT: "80"
    HOSTNAME: "localhost"
    COMPOSE: "docker compose -f docker-compose/docker-compose.yml --env-file docker-compose/.env"
  before_script:
    - $COMPOSE up -d
    - docker ps --all
  after_script:
    - $COMPOSE logs --no-color > qa/tmp/stack.log 2>&1 || true
    - $COMPOSE down -v || true

qa:terraform-docker:
  extends:
    - .qa:docker-based
  variables:
    TF_VAR_IMAGE_REGISTRY: $IMAGE_REGISTRY
    TF_VAR_IMAGE_TAG: $IMAGE_TAG
    TF_VAR_IMAGE_EDITION: $IMAGE_EDITION
    TF_VAR_ACTION_IMAGE_TAG: $ACTION_IMAGE_TAG
  before_script:
    - cd qa/deployments/terraform-docker
    - terraform init
    - terraform apply --auto-approve
    - docker ps --all
    - cd -
  after_script:
    - cd qa/deployments/terraform-docker
    - terraform destroy --auto-approve
