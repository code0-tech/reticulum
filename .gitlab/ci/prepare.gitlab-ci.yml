generate-environment:
  stage: prepare
  image: alpine:3.23
  script:
    - echo "RETICULUM_CONTAINER_VERSION=$(cat VERSION)-$RETICULUM_BUILD_TYPE-$CI_PIPELINE_ID-$CI_COMMIT_SHA" > .gitlab/ci/env
    - |
      echo -e "\e[0Ksection_start:`date +%s`:glpa_summary\r\e[0KHeader of the summary"
      grep 'RETICULUM_CONTAINER_VERSION=' .gitlab/ci/env
      echo -e "\e[0Ksection_end:`date +%s`:glpa_summary\r\e[0K"
  variables:
    RETICULUM_BUILD_TYPE: experimental
  artifacts:
    expire_in: 1 day
    reports:
      dotenv: .gitlab/ci/env
    paths:
      - .gitlab/ci/env

rubocop:qa:
  stage: prepare
  image: ghcr.io/code0-tech/build-images/reticulum-builder:656.1-ruby-3.4.7
  script:
    - cd qa
    - bundle install
    - rubocop_exit_code=0; git_exit_code=0
    - bundle exec rubocop -A || rubocop_exit_code=$?
    - git diff --exit-code || git_exit_code=$?
    - exit $(($rubocop_exit_code + $git_exit_code))
